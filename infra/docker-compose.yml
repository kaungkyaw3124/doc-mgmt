services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: docmgmt
      POSTGRES_USER: docmgmt
      # Override via an infra/.env file (docker-compose auto-loads it) —
      # these defaults are only safe for local dev, not a shared host.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docmgmt}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d   # creates the "catalogue" DB on first boot
    # Not published to the host — only reachable from other containers on
    # this compose network (see docs/operations.md for how to get admin
    # access to it when you need to, without leaving it open permanently).
    expose:
      - "5432"
    restart: unless-stopped

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - ./data/minio:/data
    # Not published to the host — only document-service/catalogue-service
    # reach it (S3 API), over this compose network. See docs/operations.md
    # for admin console access without leaving it open permanently.
    expose:
      - "9000"   # S3 API
      - "9001"   # web console
    restart: unless-stopped

  document-service:
    build: ../services/document-service
    env_file: ../services/document-service/.env
    depends_on:
      - postgres
      - minio
      - catalogue-service
      - meilisearch
    expose:
      - "8000"
    restart: unless-stopped

  catalogue-service:
    build: ../services/catalogue-service
    env_file: ../services/catalogue-service/.env
    depends_on:
      - postgres
      - meilisearch
      - minio
    expose:
      - "8000"
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:v1.10
    environment:
      # If you override this, also update MEILI_MASTER_KEY in each of
      # document-service/.env, catalogue-service/.env and
      # search-service/.env to match — they each connect with their own key.
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-local_dev_master_key_change_me}
      MEILI_ENV: development
    volumes:
      - ./data/meili:/meili_data
    # Not published to the host — only document-service/catalogue-service/
    # search-service reach it, over this compose network.
    expose:
      - "7700"
    restart: unless-stopped

  search-service:
    build: ../services/search-service
    env_file: ../services/search-service/.env
    depends_on:
      - meilisearch
      - document-service
    expose:
      - "8000"
    restart: unless-stopped

  auth-service:
    build: ../services/auth-service
    env_file: ../services/auth-service/.env
    depends_on:
      - postgres
    expose:
      - "8000"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    environment:
      # Must match INTERNAL_SHARED_SECRET in each of document-service/
      # catalogue-service/search-service's .env — see
      # infra/nginx/nginx.conf.template and each service's
      # app/core/gateway_auth.py.
      INTERNAL_SHARED_SECRET: ${INTERNAL_SHARED_SECRET:-local_dev_internal_secret_change_me}
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/nginx.conf.template:ro
      - ../web:/usr/share/nginx/html:ro
    # Render the template (substituting ONLY $INTERNAL_SHARED_SECRET —
    # see the comment at the top of nginx.conf.template for why the
    # variable list passed to envsubst must stay this explicit) into the
    # real config, then start Nginx normally.
    entrypoint:
      - /bin/sh
      - -c
      - envsubst '$$INTERNAL_SHARED_SECRET' < /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf && exec nginx -g 'daemon off;'
    ports:
      - "8080:80"
    depends_on:
      - document-service
      - catalogue-service
      - search-service
      - auth-service
      - minio
    restart: unless-stopped
