# Task 8 — baseline security response headers. `include`d as one of the
# first directives in every CLIENT-FACING location: the frontend
# (`location /`), the MinIO-proxied downloads (`/documents/`, `/products/`),
# and every `/api/*` location (alongside infra/nginx/cors.conf). NOT
# included in the internal-only `= /_verify` location — no client ever
# reaches it directly, so headers meant for a browser response are moot
# there.
#
# `always` on every directive: these must appear on error responses too
# (401/403/404/5xx, not just 2xx) — an attacker probing a blocked
# request or a 404 is exactly when clickjacking/MIME-sniffing
# protections matter most, and nosniff on an error page prevents a
# custom error body from ever being MIME-sniffed into something
# executable.
#
# X-Content-Type-Options: stops a browser from re-guessing a response's
# type from its content and rendering it as something more dangerous
# than the declared Content-Type — the same class of attack Task 5's
# upload/content-type hardening defends against on the way IN; this is
# the equivalent defense on the way OUT, for every response this app
# ever serves (the frontend page, JSON API responses, and MinIO-proxied
# uploaded files alike).
add_header X-Content-Type-Options "nosniff" always;

# Referrer-Policy: this app is same-origin end-to-end (see cors.conf) —
# there is no legitimate reason a full URL (which can carry query
# strings, IDs, etc.) should ever leak to a different origin in a
# Referer header. strict-origin-when-cross-origin sends the full
# referrer on same-origin requests (harmless — it's this app talking to
# itself) and only the bare origin on the one real cross-origin request
# this app ever makes (fetching the Google Fonts stylesheet), never the
# full path.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Framing protection: nothing in this app embeds a frame, and nothing
# should ever be allowed to embed THIS app in one either (classic
# clickjacking defense — e.g. an attacker page overlaying invisible
# buttons on top of what looks like this app's UI). CSP's
# frame-ancestors is the modern mechanism and is what actually governs
# this in current browsers; X-Frame-Options is kept alongside it only
# for any legacy client that doesn't understand frame-ancestors — both
# express the identical "same-origin only" policy, never a conflict.
add_header X-Frame-Options "SAMEORIGIN" always;

# Permissions-Policy: this app uses none of these browser capabilities
# anywhere (confirmed by inspecting web/index.html for
# navigator.mediaDevices/geolocation/clipboard/requestFullscreen/
# PaymentRequest/usb — none exist), so every one of them is denied
# outright rather than left available for something else running in
# this browsing context (e.g. an injected/compromised script, or a
# future dependency) to invoke without it ever being a legitimate,
# reviewed feature of this app.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), fullscreen=(), clipboard-read=(), clipboard-write=()" always;

# Content-Security-Policy — built from what web/index.html (the ONLY
# file this app ever serves as a page — there is no other .html/.js/.css
# file anywhere in web/) actually does, not a permissive default:
#   script-src   'sha256-0BnN+scBSv0vZSrhO/wrV4CvVEBL1IkErTGLikKlN6I='
#                the exact SHA-256 hash of the one inline <script>
#                block's exact text content (line 1487 at the time this
#                was computed). No 'unsafe-inline', no 'unsafe-eval' —
#                the app has zero eval()/new Function() usage and zero
#                inline event-handler attributes (onclick=, onload=,
#                etc. — grepped, none exist), so nothing else needs to
#                execute as script. IMPORTANT MAINTENANCE NOTE: this
#                hash is tied to the EXACT byte content of that <script>
#                block. Any future edit to it (even whitespace) changes
#                the hash and will make the browser refuse to run the
#                script entirely (a silently broken app, not a loud
#                error) until this value is recomputed — see
#                docs/SECURITY_HARDENING_LOG.md's Task 8 entry for the
#                exact recomputation command.
#   style-src    'unsafe-inline' IS used here, deliberately, unlike
#                script-src: web/index.html has ~227 inline style="..."
#                attributes scattered across the file (many with
#                dynamically-computed values, e.g. a progress-bar width
#                built from live data), which cannot be covered by a
#                hash — a hash only matches a single, fixed, exact
#                string, not "whatever percentage this happens to render
#                today". Converting every one of them to CSS classes
#                would be a large, risky rewrite of a 5000+ line file
#                with no build step, far past "the minimum secure change
#                necessary" this task calls for. This is accepted as a
#                deliberate, narrow, documented exception: inline STYLE
#                alone (with script-src still strictly locked down,
#                separately) cannot execute JavaScript in a modern
#                browser — the actual high-severity vector (arbitrary
#                script execution) is what script-src's hash-only policy
#                above blocks. https://fonts.googleapis.com is allowed
#                here because that's where the Google Fonts stylesheet
#                <link> actually loads from.
#   font-src     https://fonts.gstatic.com — where the Google Fonts
#                *.woff2 files the above stylesheet references are
#                actually hosted (a different host than the CSS itself,
#                by Google's own convention).
#   img-src      'self' only — web/index.html contains no <img> tag and
#                creates none dynamically (grepped); every file
#                preview/logo/seal is opened via window.open() as a new
#                top-level tab (see routers below), never rendered
#                inline as an <img>, so there's nothing to widen this
#                for.
#   connect-src  'self' only — every fetch() call in the app targets
#                API_BASE ('/api', same-origin); there is no external
#                API call anywhere.
#   object-src   'none' — no <object>/<embed> anywhere in the app.
#   frame-src    'none' — no <iframe> anywhere in the app.
#   frame-ancestors 'self' — see X-Frame-Options above; this is the
#                directive that actually enforces it in current browsers.
#   base-uri     'self' — blocks a hypothetical injected <base> tag from
#                silently rehoming every relative URL/asset reference in
#                the page to an attacker-controlled origin.
#   form-action  'self' — every <form> in this app is JS-handled with
#                preventDefault() + fetch(), none has an action=
#                attribute pointing anywhere at all (grepped) — this is
#                pure defense-in-depth against a hypothetical injected
#                <form> ever being allowed to submit somewhere else.
# default-src 'self' is the fallback for every directive not listed
# above (worker-src, manifest-src, media-src, ...) — none of those
# resource types are used anywhere in this app either.
add_header Content-Security-Policy "default-src 'self'; script-src 'sha256-0BnN+scBSv0vZSrhO/wrV4CvVEBL1IkErTGLikKlN6I='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self'; connect-src 'self'; object-src 'none'; frame-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;

# Deliberately NOT setting Strict-Transport-Security (HSTS) here — see
# docs/SECURITY_HARDENING_LOG.md's Task 8 entry for the full reasoning.
# In short: this Nginx only ever `listen`s on plain HTTP (port 80,
# nowhere in this repository does it terminate TLS itself), so this
# repository cannot honestly guarantee HTTPS is in place wherever this
# config runs. Telling a browser "only ever use HTTPS with this host"
# via HSTS when that isn't actually true yet would make the site
# unreachable rather than more secure. HSTS belongs at whatever layer
# actually terminates TLS in front of this Nginx in production (a cloud
# load balancer, a separate TLS-terminating reverse proxy, etc. — see
# docs/deployment.md) — add it there once HTTPS is genuinely guaranteed,
# not here on the assumption that it will be.
