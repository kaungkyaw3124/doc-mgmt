# Task 7 — explicit, allowlist-based CORS. `include`d as the FIRST
# directive inside every browser-facing API location in nginx.conf.template
# (never the internal-only /_verify location, and never the unauthenticated
# MinIO presigned-download passthroughs — neither is part of the
# credentialed-cross-origin-fetch surface this exists for). See
# docs/SECURITY_HARDENING_LOG.md's Task 7 entry for the full design
# rationale. This file needs NO envsubst substitution itself — it only
# references nginx's own $cors_allowed_origin variable, which is set by
# the `map` block in nginx.conf.template (the one place that DOES
# envsubst the real ${CORS_ALLOWED_ORIGIN} value in).
#
# $cors_allowed_origin is the empty string unless the request's Origin
# header is an EXACT match for the single configured trusted origin — an
# unrecognized or absent Origin gets NO CORS headers at all, so the
# browser blocks the response itself. Never a wildcard, never an
# unconditional echo of whatever Origin a client happened to send.
add_header 'Access-Control-Allow-Origin' $cors_allowed_origin always;
add_header 'Access-Control-Allow-Credentials' 'true' always;
add_header 'Vary' 'Origin' always;

# Preflight is answered HERE, before this location's own auth_request (on
# the locations that have one) ever runs. A real preflight OPTIONS never
# carries the Authorization header — asking permission before the browser
# sends the real, possibly-credentialed request is the entire point of a
# preflight — so letting it reach this app's own /_verify auth gate would
# always 401 it, breaking every credentialed cross-origin call before it
# could ever succeed. No backend involvement needed to answer a preflight.
if ($request_method = OPTIONS) {
    add_header 'Access-Control-Allow-Origin' $cors_allowed_origin always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;
    # Exactly the methods this frontend actually issues (see web/index.html)
    # plus OPTIONS itself — never a blanket allow-everything list.
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PATCH, DELETE, OPTIONS' always;
    # Exactly the headers this frontend actually sends: Authorization (the
    # bearer access token) and Content-Type (JSON request bodies).
    add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
    add_header 'Access-Control-Max-Age' '600' always;
    add_header 'Vary' 'Origin' always;
    add_header 'Content-Length' '0' always;
    return 204;
}
