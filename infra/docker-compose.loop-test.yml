# Throwaway test stack (loop/LOOP.md "Protect the user's data"). Layered on
# top of docker-compose.yml with its own project name, so it never shares
# containers, ports or data folders with the real stack on :8080:
#
#   COMPOSE_PROJECT_NAME=loop-test COMPOSE_OVERRIDE=infra/docker-compose.loop-test.yml \
#     GATEWAY=http://localhost:18080 ALLOW_DESTRUCTIVE_TESTS=1 ./scripts/verify.sh --keep
#
# The base file's data lives in bind mounts (./data/...), which a different
# project name alone would NOT separate — every data path is re-pointed here.
# Tear down with: ./scripts/loop-test-down.sh (down -v + deletes
# infra/data-loop-test/, which is root-owned, from a container).
services:
  postgres:
    volumes: !override
      - ./data-loop-test/postgres:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
  minio:
    volumes: !override
      - ./data-loop-test/minio:/data
  meilisearch:
    volumes: !override
      - ./data-loop-test/meili:/meili_data
  # Presigned URLs must point at this stack's gateway, not the real one.
  document-service:
    environment:
      MINIO_PUBLIC_ENDPOINT: localhost:18080
  catalogue-service:
    environment:
      MINIO_PUBLIC_ENDPOINT: localhost:18080
  backup-service:
    volumes: !override
      - ./data-loop-test/backups:/backups
      - ./data-loop-test/maintenance:/maintenance
  nginx:
    ports: !override
      - "18080:80"
      - "18443:443"
    volumes:
      - ./data-loop-test/nginx-certs:/etc/nginx/certs
      - ./data-loop-test/maintenance:/maintenance:ro
