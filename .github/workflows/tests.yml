name: tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  auth-service:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: docmgmt
          POSTGRES_PASSWORD: docmgmt
          POSTGRES_DB: auth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docmgmt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: services/auth-service
        run: pip install -r requirements-dev.txt
      - name: Run tests
        working-directory: services/auth-service
        env:
          TEST_DATABASE_URL: postgresql://docmgmt:docmgmt@localhost:5432/auth_test
        run: python -m pytest -v
