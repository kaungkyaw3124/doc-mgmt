name: tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  auth-service:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: docmgmt
          POSTGRES_PASSWORD: docmgmt
          POSTGRES_DB: auth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docmgmt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: services/auth-service
        run: pip install -r requirements-dev.txt
      - name: Run tests
        working-directory: services/auth-service
        env:
          TEST_DATABASE_URL: postgresql://docmgmt:docmgmt@localhost:5432/auth_test
        run: python -m pytest -v

  catalogue-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: services/catalogue-service
        run: pip install -r requirements-dev.txt
      - name: Run tests
        working-directory: services/catalogue-service
        run: python -m pytest -v

  document-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install WeasyPrint system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf2.0-0 \
            libffi-dev shared-mime-info fonts-liberation
      - name: Install dependencies
        working-directory: services/document-service
        run: pip install -r requirements-dev.txt
      - name: Run tests
        working-directory: services/document-service
        run: python -m pytest -v

  search-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: services/search-service
        run: pip install -r requirements-dev.txt
      - name: Run tests
        working-directory: services/search-service
        run: python -m pytest -v

  infra-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create per-service .env files from .env.example (dev defaults)
        run: |
          for svc in auth-service catalogue-service document-service search-service; do
            cp "services/$svc/.env.example" "services/$svc/.env"
          done

      - name: Build and start the full stack
        working-directory: infra
        run: docker compose up -d --build

      - name: Wait for Nginx to answer a public, no-auth endpoint
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/auth/groups-public || echo 000)
            if [ "$code" = "200" ]; then echo "up after ${i}0s"; exit 0; fi
            sleep 10
          done
          echo "auth-service via Nginx never became healthy"
          docker compose -f infra/docker-compose.yml ps
          docker compose -f infra/docker-compose.yml logs --tail=200
          exit 1

      - name: All containers are running (internal service-to-service comms worked at boot)
        working-directory: infra
        run: |
          # document-service/catalogue-service's on_startup calls
          # ensure_bucket_exists() against MinIO and sets Meilisearch
          # filterable attributes — if either were unreachable over the
          # internal network, those services would have failed to boot.
          docker compose ps
          for svc in postgres minio meilisearch document-service catalogue-service search-service auth-service nginx; do
            state=$(docker compose ps --format '{{.State}}' "$svc")
            echo "$svc: $state"
            case "$state" in
              running) ;;
              *) echo "FAIL: $svc is not running ($state)"; exit 1 ;;
            esac
          done

      - name: Acceptance — Postgres/MinIO/Meilisearch are NOT reachable from the host
        run: |
          fail=0
          for port in 5432 9000 9001 7700; do
            if timeout 2 bash -c "cat < /dev/null > /dev/tcp/127.0.0.1/$port" 2>/dev/null; then
              echo "FAIL: host port $port is open (should not be published)"
              fail=1
            else
              echo "OK: host port $port is closed"
            fi
          done
          exit $fail

      - name: Acceptance — presigned-download proxy path reaches MinIO through Nginx
        run: |
          # No valid signature on this request, so MinIO is expected to
          # reject it — the point is confirming Nginx's /documents/ and
          # /products/ locations actually reach the minio container
          # (a 502/504/connection-refused here would mean the proxy is
          # broken), not that this specific request succeeds.
          for path in /documents/no-such-key /products/no-such-key; do
            code=$(curl -s -o /tmp/resp.xml -w '%{http_code}' "http://localhost:8080$path")
            echo "$path -> $code"
            if [ "$code" = "502" ] || [ "$code" = "504" ] || [ "$code" = "000" ]; then
              echo "FAIL: $path did not reach MinIO through Nginx (got $code)"
              cat /tmp/resp.xml
              exit 1
            fi
          done

      - name: Acceptance — legitimate requests through Nginx still work (login + protected endpoint)
        run: |
          token=$(curl -s -X POST http://localhost:8080/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"CHANGE_ME"}' | python3 -c 'import sys,json; print(json.load(sys.stdin)["access_token"])')
          if [ -z "$token" ]; then
            echo "FAIL: could not log in as the seeded admin through Nginx"
            exit 1
          fi
          code=$(curl -s -o /tmp/products.json -w '%{http_code}' http://localhost:8080/api/products -H "Authorization: Bearer $token")
          echo "GET /api/products (through Nginx, real token) -> $code"
          if [ "$code" != "200" ]; then
            echo "FAIL: a legitimate authenticated request through Nginx was rejected"
            cat /tmp/products.json
            exit 1
          fi

      - name: Acceptance — Nginx overwrites client-supplied trust/secret headers, not just adds to them
        run: |
          # A client sending its OWN X-Internal-Secret and X-Access-Level
          # through Nginx must not have either survive to document-service:
          # proxy_set_header REPLACES the header Nginx forwards, so if this
          # still returns 200 (not 401 from the gateway check, not
          # elevated/broken behavior), that proves Nginx's real secret won,
          # not the client's forged one — a client can't smuggle a header
          # through by sending it alongside legitimate auth.
          token=$(curl -s -X POST http://localhost:8080/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"CHANGE_ME"}' | python3 -c 'import sys,json; print(json.load(sys.stdin)["access_token"])')
          code=$(curl -s -o /tmp/spoofed.json -w '%{http_code}' http://localhost:8080/api/products \
            -H "Authorization: Bearer $token" \
            -H 'X-Internal-Secret: attacker-supplied-secret' \
            -H 'X-Access-Level: superuser' \
            -H 'X-Allowed-Projects: attacker-controlled')
          echo "GET /api/products through Nginx with client-forged trust headers -> $code"
          if [ "$code" != "200" ]; then
            echo "FAIL: expected this to still succeed via Nginx's own overwritten headers (got $code) — Nginx may not be overwriting the client's forged headers"
            cat /tmp/spoofed.json
            exit 1
          fi

      - name: Acceptance — header spoofing directly against a backend service (bypassing Nginx) is rejected
        run: |
          fail=0

          # No X-Internal-Secret at all, but a spoofed superuser-shaped
          # trust header — must be rejected before ever reaching the route.
          code=$(docker run --rm --network infra_default curlimages/curl -s -o /dev/null -w '%{http_code}' \
            -H 'X-Allowed-Projects: ALL' -H 'X-Access-Level: edit' \
            http://catalogue-service:8000/products)
          echo "direct catalogue-service call, no secret, spoofed headers -> $code"
          [ "$code" = "401" ] || { echo "FAIL: expected 401, got $code"; fail=1; }

          # Wrong X-Internal-Secret — also rejected.
          code=$(docker run --rm --network infra_default curlimages/curl -s -o /dev/null -w '%{http_code}' \
            -H 'X-Internal-Secret: wrong-secret' -H 'X-Allowed-Projects: ALL' \
            http://catalogue-service:8000/products)
          echo "direct catalogue-service call, wrong secret -> $code"
          [ "$code" = "401" ] || { echo "FAIL: expected 401, got $code"; fail=1; }

          # Same call against document-service, for good measure.
          code=$(docker run --rm --network infra_default curlimages/curl -s -o /dev/null -w '%{http_code}' \
            -H 'X-Allowed-Projects: ALL' -H 'X-Access-Level: edit' -H 'X-Username: admin' \
            http://document-service:8000/documents)
          echo "direct document-service call, no secret, spoofed headers -> $code"
          [ "$code" = "401" ] || { echo "FAIL: expected 401, got $code"; fail=1; }

          # Correct secret — the gateway check itself must NOT be what's
          # blocking this one (whatever the app returns from here on is
          # a normal routing/DB concern, not a 401 from the gateway guard).
          code=$(docker run --rm --network infra_default curlimages/curl -s -o /dev/null -w '%{http_code}' \
            -H 'X-Internal-Secret: local_dev_internal_secret_change_me' \
            http://catalogue-service:8000/health)
          echo "direct catalogue-service call, correct secret, /health -> $code"
          [ "$code" = "200" ] || { echo "FAIL: expected 200, got $code"; fail=1; }

          exit $fail

      - name: Acceptance — uploaded file Content-Type is derived server-side, not trusted from the client
        run: |
          fail=0
          token=$(curl -s -X POST http://localhost:8080/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"CHANGE_ME"}' | python3 -c 'import sys,json; print(json.load(sys.stdin)["access_token"])')

          product_id=$(curl -s -X POST http://localhost:8080/api/products \
            -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            -d '{"name":"Upload Safety Test Product"}' | python3 -c 'import sys,json; print(json.load(sys.stdin)["id"])')
          echo "created product $product_id"

          # Real HTML content, named with a .pdf extension AND the client
          # explicitly (falsely) claiming Content-Type: text/html — both
          # the extension-spoofing and the Content-Type-spoofing attack in
          # one request.
          printf '<html><body><script>document.title="pwned"</script></body></html>' > /tmp/evil.pdf
          curl -s -X POST "http://localhost:8080/api/products/$product_id/file" \
            -H "Authorization: Bearer $token" \
            -F "file=@/tmp/evil.pdf;filename=evil.pdf;type=text/html" > /tmp/upload_resp.json
          cat /tmp/upload_resp.json

          file_url=$(curl -s "http://localhost:8080/api/products/$product_id/file-url" -H "Authorization: Bearer $token" \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["url"])')
          echo "presigned url: $file_url"

          served_content_type=$(curl -s -o /dev/null -D - "$file_url" | tr -d '\r' | grep -i '^Content-Type:' | head -1)
          echo "served -> $served_content_type"
          if echo "$served_content_type" | grep -qi 'text/html'; then
            echo "FAIL: server served the upload back as text/html — client-supplied Content-Type was trusted"
            fail=1
          fi
          if ! echo "$served_content_type" | grep -qi 'application/pdf'; then
            echo "FAIL: expected application/pdf (derived from the .pdf extension), got: $served_content_type"
            fail=1
          fi

          # Now an SVG (a real, correctly-typed image format that can still
          # carry <script>) — must come back forced to download, not opened
          # inline, regardless of its Content-Type.
          printf '<svg xmlns="http://www.w3.org/2000/svg"><script>alert(1)</script></svg>' > /tmp/evil.svg
          curl -s -X POST "http://localhost:8080/api/products/$product_id/file" \
            -H "Authorization: Bearer $token" \
            -F "file=@/tmp/evil.svg;filename=evil.svg;type=image/svg+xml" > /tmp/upload_resp2.json

          file_url2=$(curl -s "http://localhost:8080/api/products/$product_id/file-url" -H "Authorization: Bearer $token" \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["url"])')
          disposition=$(curl -s -o /dev/null -D - "$file_url2" | tr -d '\r' | grep -i '^Content-Disposition:' | head -1)
          echo "svg served -> $disposition"
          if ! echo "$disposition" | grep -qi 'attachment'; then
            echo "FAIL: expected Content-Disposition: attachment for an SVG upload, got: $disposition"
            fail=1
          fi

          # And a normal legitimate upload must still work end-to-end.
          printf '%%PDF-1.4 legitimate test content' > /tmp/legit.pdf
          code=$(curl -s -o /tmp/legit_resp.json -w '%{http_code}' -X POST "http://localhost:8080/api/products/$product_id/file" \
            -H "Authorization: Bearer $token" \
            -F "file=@/tmp/legit.pdf;filename=quote.pdf;type=application/pdf")
          echo "legitimate PDF upload -> $code"
          [ "$code" = "200" ] || { echo "FAIL: a legitimate PDF upload was rejected"; cat /tmp/legit_resp.json; fail=1; }

          exit $fail

      - name: Dump logs on failure
        if: failure()
        working-directory: infra
        run: docker compose logs --tail=300

      - name: Tear down
        if: always()
        working-directory: infra
        run: docker compose down -v
